<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動漫主題大數字倒數計時器</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter & Orbitron for massive numbers -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@700;900&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: background 0.5s ease, color 0.5s ease;
        }
        .timer-font {
            font-family: 'Orbitron', monospace;
            font-variant-numeric: tabular-nums;
        }
        .anime-font {
            font-family: 'ZCOOL KuaiLe', cursive, sans-serif;
        }
        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(0.98); }
        }
        .animate-pulse-subtle {
            animation: pulse-subtle 2s infinite ease-in-out;
        }
    </style>
</head>
<body id="appBody" class="h-full dora-theme text-blue-900 flex flex-col justify-between selection:bg-blue-400 selection:text-white overflow-x-hidden">

    <!-- Top Header / Controls Toggle -->

                </h1>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <!-- Gear Settings Button -->
            <button onclick="openSettingsModal()" class="p-3 rounded-2xl bg-white/80 backdrop-blur-md border border-slate-200 text-slate-700 hover:text-blue-600 hover:bg-white transition-all shadow-md active:scale-95 group" title="設定與主題切換">
                <svg class="w-5 h-5 group-hover:rotate-90 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
            </button>
            <button onclick="toggleFullscreen()" class="p-3 rounded-2xl bg-white/80 backdrop-blur-md border border-slate-200 text-slate-700 hover:text-blue-600 hover:bg-white transition-all shadow-md active:scale-95" title="全螢幕模式">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Content: Giant Countdown Display -->
    <main class="flex-1 flex flex-col items-center justify-center px-4 w-full max-w-5xl mx-auto -mt-10">
        
        <!-- Preset Quick Buttons -->
        <div id="presetsContainer" class="flex flex-wrap items-center justify-center gap-3 mb-8 transition-opacity duration-300">
            <button onclick="setPreset(1)" class="preset-btn px-5 py-2.5 rounded-2xl bg-white/80 backdrop-blur-md border border-slate-200 hover:border-current text-sm font-semibold transition-all shadow-sm">⏱️ 1 分鐘</button>
            <button onclick="setPreset(3)" class="preset-btn px-5 py-2.5 rounded-2xl bg-white/80 backdrop-blur-md border border-slate-200 hover:border-current text-sm font-semibold transition-all shadow-sm">⏱️ 3 分鐘</button>
            <button onclick="setPreset(5)" class="preset-btn px-5 py-2.5 rounded-2xl bg-white/80 backdrop-blur-md border border-slate-200 hover:border-current text-sm font-semibold transition-all shadow-sm">⏱️ 5 分鐘</button>
            <button onclick="setPreset(10)" class="preset-btn px-5 py-2.5 rounded-2xl bg-white/80 backdrop-blur-md border border-slate-200 hover:border-current text-sm font-semibold transition-all shadow-sm">⏱️ 10 分鐘</button>
            <button onclick="setPreset(25)" class="preset-btn px-5 py-2.5 rounded-2xl bg-white/80 backdrop-blur-md border border-slate-200 hover:border-current text-sm font-semibold transition-all shadow-sm">🍅 25 分鐘</button>
            <button onclick="setPreset(60)" class="preset-btn px-5 py-2.5 rounded-2xl bg-white/80 backdrop-blur-md border border-slate-200 hover:border-current text-sm font-semibold transition-all shadow-sm">⏳ 60 分鐘</button>
        </div>

        <!-- Giant Numbers Display / Click to Open Modal -->
        <div class="relative group cursor-pointer text-center w-full py-6 bg-white/70 backdrop-blur-2xl rounded-[3rem] border border-white/60 shadow-2xl px-6 sm:px-12 my-2 transition-all hover:bg-white/90" onclick="openSettingsModal()" title="點擊設定時間與主題">
            <div id="tagPill" class="absolute -top-4 left-1/2 transform -translate-x-1/2 bg-blue-500 text-white px-5 py-1 rounded-full text-xs font-bold tracking-widest shadow-lg anime-font">
                ✨ 任意門倒數中 ✨
            </div>
            <div id="timerDisplay" class="timer-font text-6xl sm:text-8xl md:text-[10rem] lg:text-[12rem] font-black tracking-tight text-blue-600 drop-shadow-md select-none transition-all duration-300 py-2">
                05:00
            </div>
            <div class="absolute inset-x-0 bottom-4 flex justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-200">
                <span id="hintPill" class="text-xs uppercase tracking-widest text-white bg-blue-500 border border-blue-400 px-5 py-1.5 rounded-full shadow-md font-medium anime-font">點擊開啟設定與參數 ⚙️</span>
            </div>
        </div>

        <!-- Main Action Buttons -->
        <div class="flex items-center justify-center space-x-4 mt-10">
            <button id="startPauseBtn" onclick="toggleTimer()" class="px-9 py-4 rounded-3xl bg-blue-500 hover:bg-blue-600 text-white font-bold text-lg shadow-xl shadow-blue-500/30 hover:shadow-blue-600/40 active:scale-95 transition-all flex items-center space-x-2.5 min-w-[160px] justify-center anime-font">
                <svg id="startIcon" class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <span id="startPauseText">開始計時</span>
            </button>
            <button onclick="resetTimer()" class="px-7 py-4 rounded-3xl bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 font-bold text-lg transition-all active:scale-95 shadow-md anime-font">
                重設
            </button>
        </div>

    </main>

    <!-- Footer Status -->
    <footer class="w-full max-w-4xl mx-auto px-6 py-6 text-center text-xs font-medium opacity-80">
        <p id="footerText">🔔 多啦Ａ夢時光機 — 把握當下每一秒美好時光 🔔</p>
    </footer>

    <!-- Comprehensive Settings Modal (Gear Button Trigger) -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-950/40 backdrop-blur-md z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white border border-slate-200 rounded-[2.5rem] p-6 sm:p-8 w-full max-w-lg shadow-2xl transform scale-95 transition-transform duration-300 relative overflow-hidden" id="modalCard">
            <div class="absolute top-0 right-0 w-40 h-40 bg-blue-100 rounded-full blur-3xl -z-10 opacity-60"></div>
            
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-2xl font-bold text-slate-800 flex items-center gap-2 anime-font">
                    <span>⚙️</span> 系統參數與動漫風格設定
                </h3>
                <button onclick="closeSettingsModal()" class="p-2 rounded-full hover:bg-slate-100 text-slate-400 hover:text-slate-600 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- Tab 1: Theme Selector -->
            <div class="mb-6">
                <label class="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider">選擇動漫視覺風格 (Anime Theme)</label>
                <div class="grid grid-cols-3 gap-3">
                    <button onclick="setTheme('dora')" id="themeBtnDora" class="flex flex-col items-center p-3 rounded-2xl border-2 border-blue-500 bg-blue-50/50 text-blue-900 transition-all font-bold text-sm">
                        <span class="text-2xl mb-1">🐱</span>
                        <span>多啦Ａ夢</span>
                        <span class="text-[10px] text-blue-500 font-normal mt-0.5">未來藍與紅鈴鐺</span>
                    </button>
                    <button onclick="setTheme('onepiece')" id="themeBtnOnePiece" class="flex flex-col items-center p-3 rounded-2xl border-2 border-slate-200 bg-white text-slate-700 transition-all font-bold text-sm">
                        <span class="text-2xl mb-1">🏴‍☠️</span>
                        <span>航海王</span>
                        <span class="text-[10px] text-amber-600 font-normal mt-0.5">草帽海賊航海金</span>
                    </button>
                    <button onclick="setTheme('master')" id="themeBtnMaster" class="flex flex-col items-center p-3 rounded-2xl border-2 border-slate-200 bg-white text-slate-700 transition-all font-bold text-sm">
                        <span class="text-2xl mb-1">🔥</span>
                        <span>小當家</span>
                        <span class="text-[10px] text-red-600 font-normal mt-0.5">特級廚師中華炎</span>
                    </button>
                </div>
            </div>

            <!-- Tab 2: Custom Time Input -->
            <div class="mb-6">
                <label class="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider">自訂倒數時間 (Custom Duration)</label>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <span class="block text-xs font-semibold text-slate-500 mb-1">分鐘 (Minutes)</span>
                        <input type="number" id="inputMinutes" min="0" max="999" value="5" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-center text-xl font-bold text-slate-800 focus:outline-none focus:border-blue-500 transition-colors">
                    </div>
                    <div>
                        <span class="block text-xs font-semibold text-slate-500 mb-1">秒數 (Seconds)</span>
                        <input type="number" id="inputSeconds" min="0" max="59" value="0" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-center text-xl font-bold text-slate-800 focus:outline-none focus:border-blue-500 transition-colors">
                    </div>
                </div>
            </div>

            <!-- Sound & Toggles -->
            <div class="mb-8 flex items-center justify-between bg-slate-50 p-4 rounded-2xl border border-slate-200">
                <div>
                    <span class="block text-sm font-bold text-slate-800">音效提示 (Sound Alarm)</span>
                    <span class="text-xs text-slate-500">倒數結束時播放音樂提醒</span>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="soundToggle" checked class="sr-only peer">
                    <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                </label>
            </div>

            <!-- Action Footer -->
            <div class="flex space-x-3">
                <button onclick="closeSettingsModal()" class="flex-1 py-3.5 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold transition-colors">取消</button>
                <button onclick="applySettings()" class="flex-1 py-3.5 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white font-bold transition-colors shadow-lg shadow-blue-600/30">儲存設定</button>
            </div>
        </div>
    </div>

    <!-- Custom Notification/Message Box (No alert() used) -->
    <div id="messageBox" class="fixed top-6 left-1/2 transform -translate-x-1/2 -translate-y-20 opacity-0 pointer-events-none transition-all duration-300 z-50 bg-blue-600 text-white px-6 py-3.5 rounded-2xl shadow-xl font-semibold text-sm flex items-center space-x-2.5 border border-blue-400 anime-font">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span id="messageText">提示訊息</span>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // State variables
        let totalSeconds = 300; // Default 5 minutes
        let remainingSeconds = 300;
        let timerId = null;
        let isRunning = false;
        let currentTheme = 'dora'; // 'dora' | 'onepiece' | 'master'

        // Theme Definitions
        const themes = {
            dora: {
                name: '多啦Ａ夢時光機',
                badgeText: '✨ 任意門倒數中 ✨',
                footerText: '🔔 多啦Ａ夢時光機 — 把握當下每一秒美好時光 🔔',
                emoji: '🐱',
                bgClass: 'bg-gradient-to-br from-blue-100 via-sky-50 to-indigo-100 text-blue-900',
                primaryColor: '#2563eb', // blue-600
                primaryBg: 'bg-blue-600 hover:bg-blue-700 text-white shadow-blue-600/30',
                activeBtnBg: 'bg-amber-500 hover:bg-amber-600 text-white shadow-amber-500/30',
                displayColor: 'text-blue-600',
                badgeBg: 'bg-blue-500 text-white',
                presetBorder: 'hover:border-blue-500 text-blue-700 hover:bg-blue-50',
                headerIconBg: 'bg-blue-500 shadow-blue-500/30 text-white'
            },
            onepiece: {
                name: '航海王黃金大航海',
                badgeText: '⚓ 航向偉大的航道 ⚓',
                footerText: '🏴‍☠️ 航海王 — 我們的夢想永遠不會結束！ 🏴‍☠️',
                emoji: '🏴‍☠️',
                bgClass: 'bg-gradient-to-br from-amber-100 via-orange-50 to-yellow-100 text-amber-950',
                primaryColor: '#d97706', // amber-600
                primaryBg: 'bg-amber-600 hover:bg-amber-700 text-white shadow-amber-600/30',
                activeBtnBg: 'bg-red-600 hover:bg-red-700 text-white shadow-red-600/30',
                displayColor: 'text-amber-700',
                badgeBg: 'bg-amber-600 text-white',
                presetBorder: 'hover:border-amber-600 text-amber-900 hover:bg-amber-50',
                headerIconBg: 'bg-amber-600 shadow-amber-600/30 text-white'
            },
            master: {
                name: '中華一番特級廚房',
                badgeText: '🔥 發光料理美味倒數 🔥',
                footerText: '🍜 中華一番小當家 — 傳說中的廚具甦醒了！ 🍜',
                emoji: '🔥',
                bgClass: 'bg-gradient-to-br from-red-100 via-orange-50 to-amber-100 text-red-950',
                primaryColor: '#dc2626', // red-600
                primaryBg: 'bg-red-600 hover:bg-red-700 text-white shadow-red-600/30',
                activeBtnBg: 'bg-amber-600 hover:bg-amber-700 text-white shadow-amber-600/30',
                displayColor: 'text-red-600',
                badgeBg: 'bg-red-600 text-white',
                presetBorder: 'hover:border-red-600 text-red-900 hover:bg-red-50',
                headerIconBg: 'bg-red-600 shadow-red-600/30 text-white'
            }
        };

        // DOM Elements
        const appBody = document.getElementById('appBody');
        const timerDisplay = document.getElementById('timerDisplay');
        const startPauseBtn = document.getElementById('startPauseBtn');
        const startIcon = document.getElementById('startIcon');
        const startPauseText = document.getElementById('startPauseText');
        const settingsModal = document.getElementById('settingsModal');
        const modalCard = document.getElementById('modalCard');
        const inputMinutes = document.getElementById('inputMinutes');
        const inputSeconds = document.getElementById('inputSeconds');
        const presetsContainer = document.getElementById('presetsContainer');
        const themeTitle = document.getElementById('themeTitle');
        const themeBadge = document.getElementById('themeBadge');
        const tagPill = document.getElementById('tagPill');
        const hintPill = document.getElementById('hintPill');
        const footerText = document.getElementById('footerText');
        const headerIcon = document.getElementById('headerIcon');
        const badgeEmoji = document.getElementById('badgeEmoji');
        const soundToggle = document.getElementById('soundToggle');

        // Initialize display
        updateDisplay();
        setTheme('dora');

        // Theme Switcher Function
        function setTheme(themeKey) {
            currentTheme = themeKey;
            const t = themes[themeKey];

            // Update Body Background
            appBody.className = `h-full flex flex-col justify-between selection:bg-blue-400 selection:text-white overflow-x-hidden ${t.bgClass}`;

            // Header elements
            badgeEmoji.textContent = t.emoji;
            headerIcon.className = `w-10 h-10 rounded-2xl flex items-center justify-center shadow-lg text-white transition-all transform hover:rotate-12 ${t.headerIconBg}`;
            themeTitle.innerHTML = `${t.name} <span class="text-xs px-2.5 py-0.5 rounded-full font-medium not-italic font-sans ${t.badgeBg}">${themeKey === 'dora' ? 'Future' : themeKey === 'onepiece' ? 'GrandLine' : 'Legend'}</span>`;

            // Display & Pills
            tagPill.className = `absolute -top-4 left-1/2 transform -translate-x-1/2 px-5 py-1 rounded-full text-xs font-bold tracking-widest shadow-lg anime-font ${t.badgeBg}`;
            hintPill.className = `text-xs uppercase tracking-widest border px-5 py-1.5 rounded-full shadow-md font-medium anime-font ${t.badgeBg}`;
            timerDisplay.className = `timer-font text-6xl sm:text-8xl md:text-[10rem] lg:text-[12rem] font-black tracking-tight drop-shadow-md select-none transition-all duration-300 py-2 ${t.displayColor}`;
            footerText.textContent = t.footerText;

            // Start Button Theme
            if (!isRunning) {
                startPauseBtn.className = `px-9 py-4 rounded-3xl font-bold text-lg shadow-xl active:scale-95 transition-all flex items-center space-x-2.5 min-w-[160px] justify-center anime-font ${t.primaryBg}`;
            }

            // Presets border styling
            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.className = `preset-btn px-5 py-2.5 rounded-2xl bg-white/80 backdrop-blur-md border border-slate-200 text-sm font-semibold transition-all shadow-sm ${t.presetBorder}`;
            });

            // Modal Theme Selector Buttons Active State
            ['dora', 'onepiece', 'master'].forEach(k => {
                const btn = document.getElementById(`themeBtn${k.charAt(0).toUpperCase() + k.slice(1)}`);
                if (btn) {
                    if (k === themeKey) {
                        btn.className = `flex flex-col items-center p-3 rounded-2xl border-2 transition-all font-bold text-sm bg-blue-50/50 border-blue-600 text-blue-900 shadow-md`;
                    } else {
                        btn.className = `flex flex-col items-center p-3 rounded-2xl border-2 border-slate-200 bg-white text-slate-700 transition-all font-bold text-sm hover:border-slate-300`;
                    }
                }
            });

            showNotification(`已切換至【${t.name}】視覺風格 🎨`);
        }

        // Format time into MM:SS or HH:MM:SS if over 1 hour
        function formatTime(totalSecs) {
            const hours = Math.floor(totalSecs / 3600);
            const minutes = Math.floor((totalSecs % 3600) / 60);
            const seconds = totalSecs % 60;

            if (hours > 0) {
                return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function updateDisplay() {
            timerDisplay.textContent = formatTime(remainingSeconds);
            if (isRunning) {
                document.title = `(${formatTime(remainingSeconds)}) ${themes[currentTheme].name} 倒數中`;
            } else {
                document.title = `${themes[currentTheme].name} 倒數計時器`;
            }
        }

        // Toggle Timer (Start / Pause)
        function toggleTimer() {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (remainingSeconds <= 0) return;
            isRunning = true;
            const t = themes[currentTheme];
            
            // UI updates
            startPauseBtn.className = `px-9 py-4 rounded-3xl font-bold text-lg shadow-xl active:scale-95 transition-all flex items-center space-x-2.5 min-w-[160px] justify-center anime-font ${t.activeBtnBg}`;
            startIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; // Pause icon
            startPauseText.textContent = '暫停計時';
            presetsContainer.classList.add('opacity-40', 'pointer-events-none');

            const startTime = Date.now();
            const initialRemaining = remainingSeconds;

            timerId = setInterval(() => {
                const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
                remainingSeconds = initialRemaining - elapsedSeconds;

                if (remainingSeconds <= 0) {
                    remainingSeconds = 0;
                    updateDisplay();
                    stopTimer();
                    if (soundToggle.checked) playAlarmSound();
                    showNotification('🌟 時間到囉！任務圓滿達成！');
                    
                    timerDisplay.classList.add('animate-bounce');
                    setTimeout(() => {
                        timerDisplay.classList.remove('animate-bounce');
                    }, 2000);
                    return;
                }
                updateDisplay();
            }, 200);
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerId);
            const t = themes[currentTheme];

            startPauseBtn.className = `px-9 py-4 rounded-3xl font-bold text-lg shadow-xl active:scale-95 transition-all flex items-center space-x-2.5 min-w-[160px] justify-center anime-font ${t.primaryBg}`;
            startIcon.innerHTML = '<path d="M8 5v14l11-7z"/>'; // Play icon
            startPauseText.textContent = '繼續計時';
            presetsContainer.classList.remove('opacity-40', 'pointer-events-none');
            updateDisplay();
        }

        function stopTimer() {
            isRunning = false;
            clearInterval(timerId);
            const t = themes[currentTheme];
            startPauseBtn.className = `px-9 py-4 rounded-3xl font-bold text-lg shadow-xl active:scale-95 transition-all flex items-center space-x-2.5 min-w-[160px] justify-center anime-font ${t.primaryBg}`;
            startIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
            startPauseText.textContent = '開始計時';
            presetsContainer.classList.remove('opacity-40', 'pointer-events-none');
        }

        function resetTimer() {
            stopTimer();
            remainingSeconds = totalSeconds;
            updateDisplay();
            showNotification('⚙️ 已重設計時器');
        }

        function setPreset(minutes) {
            if (isRunning) stopTimer();
            totalSeconds = minutes * 60;
            remainingSeconds = totalSeconds;
            updateDisplay();
            showNotification(`⏱️ 已快速設定為 ${minutes} 分鐘`);
        }

        // Settings Modal Controls
        function openSettingsModal() {
            if (isRunning) return; // Prevent opening while running
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            inputMinutes.value = mins;
            inputSeconds.value = secs;

            settingsModal.classList.remove('opacity-0', 'pointer-events-none');
            modalCard.classList.remove('scale-95');
            modalCard.classList.add('scale-100');
        }

        function closeSettingsModal() {
            settingsModal.classList.add('opacity-0', 'pointer-events-none');
            modalCard.classList.remove('scale-100');
            modalCard.classList.add('scale-95');
        }

        function applySettings() {
            const mins = parseInt(inputMinutes.value) || 0;
            const secs = parseInt(inputSeconds.value) || 0;
            const computedSecs = (mins * 60) + secs;

            if (computedSecs <= 0) {
                showNotification('⚠️ 請設定大於 0 的有效時間！');
                return;
            }

            totalSeconds = computedSecs;
            remainingSeconds = totalSeconds;
            updateDisplay();
            closeSettingsModal();
            showNotification(`✅ 設定已成功套用 (${mins}分 ${secs}秒)`);
        }

        // Web Audio API Alarm Sound
        function playAlarmSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                for (let i = 0; i < 3; i++) {
                    setTimeout(() => {
                        const osc = audioCtx.createOscillator();
                        const gainNode = audioCtx.createGain();
                        
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5 note
                        
                        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                        
                        osc.connect(gainNode);
                        gainNode.connect(audioCtx.destination);
                        
                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.5);
                    }, i * 350);
                }
            } catch (e) {
                console.log('AudioContext not supported', e);
            }
        }

        // Custom Notification Box
        function showNotification(text) {
            const box = document.getElementById('messageBox');
            document.getElementById('messageText').textContent = text;
            box.classList.remove('-translate-y-20', 'opacity-0');
            box.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                box.classList.remove('translate-y-0', 'opacity-100');
                box.classList.add('-translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Fullscreen Toggle
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    showNotification('無法進入全螢幕模式');
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
